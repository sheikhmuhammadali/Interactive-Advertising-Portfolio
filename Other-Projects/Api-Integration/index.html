<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="ad.size" content="width=320,height=480">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb Travel Ad</title>
    
    <style>
        /* Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        /* Body Styling */
        body {
            width: 320px;
            height: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            overflow: hidden;
        }

        /* Main Ad Container */
        .ad-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Background Image */
        .background {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: url('assets/background.jpg') no-repeat center center/cover;
            z-index: -1;
        }

        /* Pink Weather Info Box */
        .weather-box {
            width: 100%;
            background: #FF5A5F;
            color: white;
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin: 0 auto;
            margin-top: 80px;
        }

        /* Ensure consistent positioning */
        .weather-box h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .weather-box p {
            font-size: 14px;
            font-weight: 400;
            margin-top: 5px;
        }

        /* CTA Button */
        .cta-button {
            background: #FF5A5F;
            color: white;
            border: #ffa5a8;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            width: 50%;
            text-align: center;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-button:hover {
            background: #ffa5a8;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .weather-box { width: 95%; margin-top: 12px; }
            .cta-button { font-size: 14px; padding: 12px 20px; margin-bottom: 12px; }
        }

    </style>
</head>
<body>
    <div class="ad-container">
        <!-- Background Image -->
        <div class="background"></div>

        <!-- Weather Info -->
        <div class="weather-box">
            <h2>Perfect Weather For Trip in <span id="city">Loading...</span>!</h2>
            <p>Right now, it's <span id="temperature">--</span>°C in <span id="city-again">--</span> – time to plan your stay!</p>
        </div>

        <!-- CTA Button -->
        <a href="#" id="cta-link" class="cta-button" target="_blank">EXPLORE MORE</a>
    </div>

    <script>
        const apiKey = "455d667c5a2909ce1d70865e8da7b7bb"; // Replace with your API Key
        const cities = ["Karachi, Lahore, Islamabad"];
        const randomCity = cities[Math.floor(Math.random() * cities.length)];

        // Fetch Weather Data
        const fetchWeather = async () => {
            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${randomCity}&units=metric&appid=${apiKey}`);
                if (!response.ok) throw new Error("Weather data unavailable");

                const data = await response.json();
                const city = data.name;
                const country = data.sys.country;
                const temperature = Math.round(data.main.temp);

                // Update the text dynamically
                document.getElementById("city").innerText = city;
                document.getElementById("city-again").innerText = city;
                document.getElementById("temperature").innerText = temperature;

                // Update CTA link
                document.getElementById("cta-link").href = `https://www.airbnb.com/s/${city}--${country}/homes`;
            } catch (error) {
                console.error(error);
                document.querySelector(".weather-box").innerText = "Weather info unavailable.";
            }
        };

        fetchWeather();
    </script>

</body>
</html>
